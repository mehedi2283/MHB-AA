<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#111;color:#fff;font:14px Arial,sans-serif}.head{position:sticky;top:0;z-index:2;padding:12px 16px;background:#111;border-bottom:1px solid #444}#frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}.frame{background:#222;padding:8px}.frame div{padding:5px 0;color:#bbb}.frame canvas{display:block;width:100%;height:auto;background:#000}@media(max-width:800px){#frames{grid-template-columns:1fr}}
</style></head><body><div class="head" id="status">Loading video…</div><video id="video" src="reference.mp4" muted playsinline preload="auto" hidden></video><div id="frames"></div><script>
const video=document.querySelector('#video'),frames=document.querySelector('#frames'),status=document.querySelector('#status');
const seek=t=>new Promise(resolve=>{video.addEventListener('seeked',resolve,{once:true});video.currentTime=t});
video.addEventListener('loadedmetadata',async()=>{const count=16;status.textContent=`Duration ${video.duration.toFixed(1)}s · ${video.videoWidth}×${video.videoHeight}`;for(let i=0;i<count;i++){const t=video.duration*(i/(count-1));await seek(Math.min(t,video.duration-.05));const wrap=document.createElement('div');wrap.className='frame';const label=document.createElement('div');label.textContent=`${t.toFixed(1)}s`;const canvas=document.createElement('canvas');canvas.width=640;canvas.height=Math.round(640*video.videoHeight/video.videoWidth);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);wrap.append(label,canvas);frames.append(wrap)}status.textContent+=` · READY · ${count} frames`;document.body.dataset.ready='true'});
</script></body></html>
